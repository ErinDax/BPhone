plugins {
	id 'dev.architectury.loom' version '1.17.493' apply false
	id 'architectury-plugin' version '3.5.170'
	id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = project.maven_group
	version = "${project.mod_version}+mc${project.minecraft_version}"
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'

	base {
		archivesName = "${project.archives_name}-${project.name}"
	}

	repositories {
		maven { url = "https://repo.plasmoverse.com/releases" }
		maven { url = "https://maven.maxhenkel.de/repository/public" }
	}

	dependencies {
		minecraft "net.minecraft:minecraft:${project.minecraft_version}"
		mappings loom.officialMojangMappings()
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(project.java_version)
		}
	}
}
